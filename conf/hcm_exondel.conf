############################################################
# HCMExonDel example configuration file
#
# Format:
#   KEY=VALUE
#
# Notes:
#   1. Lines beginning with # are ignored.
#   2. BAM list is specified by hcm_exondel.pl --bam-list.
#   3. Output directory is specified by hcm_exondel.pl --outdir.
#   4. All interval files use tab-delimited TXT format.
#   5. Coordinates in TXT interval files are 1-based closed.
#   6. No BED files are required.
############################################################


############################################################
# 1. Software paths
############################################################

# Perl executable.
PERL=/usr/bin/perl

# Python executable.
PYTHON=/usr/bin/python3

# Samtools executable.
# Required by depth, split-read and discordant-read modules.
SAMTOOLS=/path/to/samtools

# Bedtools executable.
# Reserved for possible future interval operations.
BEDTOOLS=/path/to/bedtools


############################################################
# 2. Reference genome
############################################################

# Reference genome FASTA.
# Must match the genome build used for BAM alignment.
REF_FASTA=/path/to/hg19.fa

# FASTA index file generated by:
# samtools faidx hg19.fa
REF_FASTA_INDEX=/path/to/hg19.fa.fai


############################################################
# 3. MANE RefSeq coordinate TXT files
############################################################

# Exon coordinate TXT file.
#
# Required columns:
#   Gene    Transcript    Exon    Chrom    Start    End    Strand
#
# Coordinate:
#   1-based closed interval
#
# Example:
#   FHOD3    NM_001281740    12    chr18    34232240    34233000    -
REFSEQ_MANE_SELECT_EXON_TXT=db/exon_annotation_bed/RefSeq_MANE_Select.exon.txt

# Gene coordinate TXT file.
#
# Required columns:
#   Gene    Transcript    Chrom    Start    End    Strand    ExonCount
#
# Coordinate:
#   1-based closed interval
#
# Example:
#   FHOD3    NM_001281740    chr18    33877676    34360183    -    28
REFSEQ_MANE_SELECT_GENE_TXT=db/exon_annotation_bed/RefSeq_MANE_Select.gene.txt

# Flanking size added to gene regions when scanning split reads
# and discordant read pairs.
#
# Note:
#   The original gene coordinates remain 1-based.
#   Downstream scripts should internally apply this flank
#   when constructing samtools regions.
#
# Recommended:
#   0     strict gene region
#   5000  capture nearby breakpoint-supporting reads
TARGET_REGION_FLANK=5000


############################################################
# 4. BAM requirements and common read filters
############################################################

# BAM should be coordinate-sorted.
BAM_SORT=coordinate

# Whether BAM index is required.
# hcm_exondel.pl checks BAM index before generating shell.
REQUIRE_BAI=1

# Minimum mapping quality.
MIN_MAPQ=20

# Whether duplicate reads should be excluded.
#
# 1: exclude duplicate reads
# 0: keep duplicate reads
EXCLUDE_DUPLICATES=1


############################################################
# 5. Window-based depth parameters
############################################################

# Window size for gene-region depth calculation.
WINDOW_SIZE=1000

# Sliding window step size.
WINDOW_STEP=500

# Minimum mean depth required for the whole target gene region.
MIN_REGION_MEAN_DEPTH=20

# Backward-compatible parameter name.
MIN_GENE_MEAN_DEPTH=20

# Candidate low-depth ratio cutoff.
# Ratio = window mean depth / gene-region mean depth.
#
# For heterozygous deletion, the expected ratio is usually around 0.5.
DEPTH_RATIO_CUTOFF=0.65

# Expected lower boundary for heterozygous deletion ratio.
HET_DEL_RATIO_LOW=0.35

# Expected upper boundary for heterozygous deletion ratio.
HET_DEL_RATIO_HIGH=0.70

# Minimum number of abnormal windows required to form a depth candidate.
MIN_CANDIDATE_WINDOWS=1

# Maximum number of normal windows allowed between abnormal windows
# during candidate merging.
MAX_MERGE_GAP_WINDOWS=0


############################################################
# 6. Split-read parameters
############################################################

# Whether to scan whole BAM for split-read evidence.
#
# 0: scan regions from REFSEQ_MANE_SELECT_GENE_TXT
# 1: scan whole BAM
SCAN_WHOLE_BAM=0

# Minimum soft-clipped length for split-read evidence.
MIN_SOFTCLIP_LENGTH=10

# Minimum number of split reads required for a split-read candidate.
MIN_SPLIT_READS=2

# Maximum distance for clustering nearby split-read breakpoints.
SPLIT_CLUSTER_DISTANCE=200

# Breakpoint window used for grouping or annotation.
BREAKPOINT_WINDOW=200


############################################################
# 7. Discordant read-pair parameters
############################################################

# Minimum inferred insert size for deletion-like discordant read pairs.
MIN_DISCORDANT_INSERT_SIZE=1000

# Backward-compatible parameter name.
MAX_INSERT_SIZE=1000

# Minimum number of discordant read pairs required for a candidate.
MIN_DISCORDANT_READS=3

# Maximum distance for clustering nearby discordant read-pair signals.
DISCORDANT_CLUSTER_DISTANCE=1000

# Minimum size of discordant-read candidate interval.
MIN_DISCORDANT_CANDIDATE_SIZE=50

# Maximum size of discordant-read candidate interval.
MAX_DISCORDANT_CANDIDATE_SIZE=1000000

# Backward-compatible parameter name.
MIN_ANCHOR_MAPQ=20


############################################################
# 8. Evidence merging and final candidate filtering
############################################################

# Maximum distance for merging candidates from different evidence types.
#
# Evidence types:
#   depth
#   split_read
#   discordant_pair
EVIDENCE_MERGE_DISTANCE=1000

# Minimum number of evidence types required for final candidates.
#
# Recommended:
#   1: sensitive discovery
#   2: higher-confidence reporting
MIN_EVIDENCE_COUNT=2

# Whether depth evidence is required for final candidates.
#
# 1: require depth evidence
# 0: allow candidates supported only by split or discordant evidence
REQUIRE_DEPTH_EVIDENCE=1


############################################################
# 9. Candidate exon annotation
############################################################

# Minimum fraction of an exon that must overlap a candidate interval
# to be considered affected.
#
# Example:
#   0.20 means at least 20% of the exon overlaps the candidate.
MIN_EXON_OVERLAP_FRACTION=0.20

# Flanking distance for nearby exon annotation.
ANNOTATE_EXON_FLANK=100

# Whether to annotate transcript information when available.
ANNOTATE_TRANSCRIPT=1

# Whether to annotate exon number when available.
ANNOTATE_EXON_NUMBER=1


############################################################
# 10. Runtime settings
############################################################

# Number of threads used by scripts that support multithreading.
THREADS=4

# Whether to keep temporary files.
#
# 0: remove tmp directory after each sample
# 1: keep tmp directory
KEEP_TMP=0

# Verbose logging.
#
# 0: quiet
# 1: verbose
VERBOSE=1

