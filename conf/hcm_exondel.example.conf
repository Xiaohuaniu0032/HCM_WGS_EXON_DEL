############################
# Software path
############################
SAMTOOLS=/path/to/samtools
BEDTOOLS=/path/to/bedtools
PERL=/usr/bin/perl
PYTHON=/usr/bin/python3

############################
# Reference files
############################
REF_FASTA=/path/to/hg19.fa
REF_FASTA_INDEX=/path/to/hg19.fa.fai

CANONICAL_TRANSCRIPT=/path/to/canonical_transcripts.tsv
GENE_ANNOTATION_GTF=/path/to/refseq.hg19.gtf
EXON_ANNOTATION_BED=/path/to/refseq.hg19.exon.bed
HCM_CORE_GENE_LIST=/path/to/hcm_core_genes.txt
TARGET_REGION_BED=/path/to/hcm_core_genes.exon.bed

############################
# BAM requirement
############################
BAM_SORT=coordinate
REQUIRE_BAI=1
MIN_MAPQ=20

############################
# Depth parameters
############################
MIN_GENE_MEAN_DEPTH=20
MIN_EXON_MEAN_DEPTH=5
DEPTH_RATIO_CUTOFF=0.65
HET_DEL_RATIO_LOW=0.35
HET_DEL_RATIO_HIGH=0.70

############################
# Window depth parameters
############################
WINDOW_SIZE=1000
WINDOW_STEP=500

MIN_REGION_MEAN_DEPTH=20
DEPTH_RATIO_CUTOFF=0.65
HET_DEL_RATIO_LOW=0.35
HET_DEL_RATIO_HIGH=0.70

MIN_CANDIDATE_WINDOWS=1
MAX_MERGE_GAP_WINDOWS=0

############################
# Discordant reads parameters
############################
MIN_DISCORDANT_READS=3
MAX_INSERT_SIZE=1000
MIN_ANCHOR_MAPQ=20

############################
# Split reads parameters
############################
MIN_SPLIT_READS=2
MIN_SOFTCLIP_LENGTH=10
BREAKPOINT_WINDOW=200

############################
# Candidate filtering
############################
MIN_EVIDENCE_COUNT=2
PRIORITIZE_HCM_CORE_GENES=1

############################
# Output
############################
OUTDIR=./results
THREADS=4
KEEP_TMP=0
