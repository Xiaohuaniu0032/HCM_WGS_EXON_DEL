############################################################
# HCMExonDel configuration file
#
# Format:
#   KEY=VALUE
#
# Notes:
#   1. Lines beginning with # are ignored.
#   2. BAM list is specified by HCMExonDel.pl --bam-list.
#   3. Output directory is specified by HCMExonDel.pl --outdir.
#   4. TXT interval files use 1-based closed coordinates.
#   5. No BED file is required.
#   6. THREADS is not used by the current pipeline.
#   7. All workflow switches and algorithm parameters should be
#      explicitly configured here to avoid ambiguous defaults.
############################################################


############################################################
# 1. Runtime executables
############################################################

# Perl executable used by HCMExonDel.pl to call bin/*.pl scripts.
#
# Used by:
#   HCMExonDel.pl
PERL=/usr/bin/perl

# Python executable used by plotting scripts.
#
# Used by:
#   plot_depth_ratio.py
#   plot_tlen_distribution.py
PYTHON=/usr/bin/python3

# Samtools executable.
#
# Used by:
#   run_gene_mean_depth.pl
#   extract_sa_split_reads.pl
#   run_discordant_reads.pl
#   extract_candidate_gene_bam.pl
SAMTOOLS=/opt/PUB/software/Bin/samtools-1.16.1/bin/samtools


############################################################
# 2. MANE RefSeq annotation files
############################################################

# Exon coordinate TXT file.
#
# Required columns:
#   Gene Transcript Exon Chrom Start End Strand
#
# Used by:
#   annotate_candidates.pl
REFSEQ_MANE_SELECT_EXON_TXT=db/exon_annotation_bed/RefSeq_MANE_Select.exon.txt

# Gene coordinate TXT file.
#
# Required columns:
#   Gene Transcript Chrom Start End Strand ExonCount
#
# Used by:
#   run_gene_mean_depth.pl
#   extract_sa_split_reads.pl
#   run_discordant_reads.pl
#   extract_candidate_gene_bam.pl
REFSEQ_MANE_SELECT_GENE_TXT=db/exon_annotation_bed/RefSeq_MANE_Select.gene.txt

# FASTA index file.
#
# Optional but recommended for run_discordant_reads.pl.
# If provided and found, region ends can be clipped by chromosome length.
# If empty, chromosome-end clipping will be skipped.
#
# Example:
#   REF_FASTA_INDEX=/path/to/hg19.fa.fai
REF_FASTA_INDEX=


############################################################
# 3. Target gene selection
############################################################

# HCM core gene list.
#
# Expected format:
#   Gene    Classification
#   MYBPC3  Definitive
#   MYH7    Definitive
#   FHOD3   Moderate
#
# Only the first column is used as gene symbol by some scripts.
#
# Used by:
#   run_gene_mean_depth.pl
#   extract_sa_split_reads.pl
#   run_discordant_reads.pl
#   extract_candidate_gene_bam.pl
HCM_CORE_GENE_LIST=db/hcm_core_genes.txt

# Whether to analyze only genes listed in HCM_CORE_GENE_LIST.
#
# 1: only analyze HCM core genes
# 0: analyze all genes in REFSEQ_MANE_SELECT_GENE_TXT
#
# Used by:
#   run_gene_mean_depth.pl
#   extract_sa_split_reads.pl
#   run_discordant_reads.pl
ANALYZE_CORE_GENES_ONLY=1

# Flanking size added to target gene regions when scanning
# split reads and discordant read pairs.
#
# 0    : strict gene region
# 5000 : capture nearby breakpoint-supporting reads
#
# Used by:
#   extract_sa_split_reads.pl
#   run_discordant_reads.pl
TARGET_REGION_FLANK=5000


############################################################
# 4. Common read filters
############################################################

# Global minimum mapping quality.
#
# Reads with MAPQ lower than MIN_MAPQ will be filtered out.
#
# Used by:
#   run_gene_mean_depth.pl
#   extract_sa_split_reads.pl
#   cluster_sa_split_reads.pl
#   run_discordant_reads.pl
MIN_MAPQ=20

# Global duplicate-read filter.
#
# 1: exclude duplicate reads
# 0: keep duplicate reads
#
# Used by:
#   run_gene_mean_depth.pl
#   extract_sa_split_reads.pl
#   run_discordant_reads.pl
EXCLUDE_DUPLICATES=1


############################################################
# 5. Window-level depth-ratio analysis
############################################################

# Window size for depth-ratio calculation.
#
# Used by:
#   run_gene_mean_depth.pl
WINDOW_SIZE=500

# Window step size.
#
# Used by:
#   run_gene_mean_depth.pl
WINDOW_STEP=200

# Minimum accepted window size, mainly for terminal windows.
#
# Used by:
#   run_gene_mean_depth.pl
MIN_WINDOW_SIZE=200

# Minimum gene mean depth.
#
# Genes with mean depth lower than this value are still processed,
# but their windows will not be evaluated as deletion-supporting.
#
# Used by:
#   run_gene_mean_depth.pl
MIN_GENE_MEAN_DEPTH=20

# Depth ratio cutoff for deletion-supporting windows.
#
# For heterozygous exon deletion in WGS, 0.65 is a practical cutoff.
#
# Used by:
#   run_gene_mean_depth.pl
DEL_DEPTH_RATIO_CUTOFF=0.65

# Minimum number of consecutive deletion-supporting windows
# required to generate one window-level depth candidate.
#
# Used by:
#   run_gene_mean_depth.pl
MIN_CONSECUTIVE_DEL_WINDOWS=3


############################################################
# 6. Intermediate depth output control
############################################################

# Whether to keep per-gene base-level depth files.
#
# Must be 1 because:
#   Step 02 run_sample_cusum_depth.pl uses these files.
#   Step 03 run_sample_base_depth_ratio.pl also uses these files when enabled.
#
# Output:
#   SAMPLE.depth_candidates.gene_depth_files/*.depth.tsv
#
# Used by:
#   run_gene_mean_depth.pl
#   HCMExonDel.pl
KEEP_GENE_DEPTH_FILE=1

# Whether to generate per-gene base-level depth-ratio files.
#
# 1: generate SAMPLE.depth_candidates.base_depth_ratio/
# 0: skip Step 03 base_depth_ratio
#
# Used by:
#   HCMExonDel.pl
#   run_sample_base_depth_ratio.pl
OUTPUT_BASE_DEPTH_RATIO=1

# Whether to merge all per-gene base-level depth-ratio files
# into one large sample-level file.
#
# 0: do not generate SAMPLE.depth_candidates.base_depth_ratio.all.tsv
# 1: generate SAMPLE.depth_candidates.base_depth_ratio.all.tsv
#
# Recommended:
#   0 for routine batch analysis.
#   1 only for debugging or special visualization.
#
# Used by:
#   HCMExonDel.pl
#   run_sample_base_depth_ratio.pl
OUTPUT_BASE_DEPTH_RATIO_ALL=0


############################################################
# 7. CUSUM depth evidence parameters
############################################################

# Baseline depth used for CUSUM calculation.
#
# auto:
#   estimate baseline from each input gene depth file automatically.
#
# numeric value:
#   use fixed baseline depth.
#
# Used by:
#   run_sample_cusum_depth.pl
#   cusum_depth_del.pl
CUSUM_BASELINE=auto

# Bin size for CUSUM input.
#
# For base-level depth files, keep 1.
#
# Used by:
#   run_sample_cusum_depth.pl
#   cusum_depth_del.pl
CUSUM_BIN_SIZE=1

# CUSUM reference shift parameter.
#
# Larger K makes CUSUM less sensitive to mild depth fluctuation.
#
# Used by:
#   run_sample_cusum_depth.pl
#   cusum_depth_del.pl
CUSUM_K=0.1

# CUSUM calling threshold.
#
# Larger H makes deletion calling more stringent and reduces false positives.
#
# Used by:
#   run_sample_cusum_depth.pl
#   cusum_depth_del.pl
CUSUM_H=5

# Depth ratio threshold for deletion-like bins in CUSUM.
#
# This parameter is specific to CUSUM depth evidence.
# Do not confuse it with DEL_DEPTH_RATIO_CUTOFF, which is used by
# window-level depth-ratio analysis.
#
# Used by:
#   run_sample_cusum_depth.pl
#   cusum_depth_del.pl
CUSUM_DEL_RATIO=0.65

# Minimum number of bins required for one CUSUM DEL segment.
#
# This parameter is specific to CUSUM depth evidence.
# Do not confuse it with MIN_CONSECUTIVE_DEL_WINDOWS, which is used by
# window-level depth-ratio analysis.
#
# Used by:
#   run_sample_cusum_depth.pl
#   cusum_depth_del.pl
CUSUM_MIN_BINS=3

# Minimum length required for one CUSUM DEL segment.
#
# Unit:
#   bp
#
# Used by:
#   run_sample_cusum_depth.pl
#   cusum_depth_del.pl
CUSUM_MIN_LEN=1

# Segment edge refinement ratio.
#
# Used by:
#   run_sample_cusum_depth.pl
#   cusum_depth_del.pl
CUSUM_EDGE_RATIO=0.80

# Recovery ratio used to determine when a CUSUM signal returns to baseline.
#
# Used by:
#   run_sample_cusum_depth.pl
#   cusum_depth_del.pl
CUSUM_RECOVER_RATIO=0.80

# Number of consecutive recovered bins required to terminate a CUSUM segment.
#
# Used by:
#   run_sample_cusum_depth.pl
#   cusum_depth_del.pl
CUSUM_RECOVER_BINS=3


############################################################
# 8. SA split-read extraction and clustering
############################################################

# Maximum allowed breakpoint difference for clustering SA split-read
# deletion events.
#
# Both SV_Start and SV_End should be within this window for clustering.
#
# Unit:
#   bp
#
# Used by:
#   cluster_sa_split_reads.pl
SA_SPLIT_CLUSTER_WINDOW=20

# Minimum number of unique read names required for an SA split-read
# cluster to be marked as Pass.
#
# Used by:
#   cluster_sa_split_reads.pl
SA_SPLIT_MIN_SUPPORT_READS=5


############################################################
# 9. Optional TLEN QC
############################################################

# Whether to run TLEN distribution QC.
#
# 1: run Step 07 extract_valid_tlen and Step 08 plot_tlen_distribution
# 0: skip both steps
#
# Used by:
#   HCMExonDel.pl
RUN_TLEN_QC=1


############################################################
# 10. Discordant read-pair analysis
############################################################

# Minimum inferred insert size for deletion-like read pairs.
#
# Used by:
#   run_discordant_reads.pl
MIN_DISCORDANT_INSERT_SIZE=500

# Minimum number of discordant read pairs required to support one cluster.
#
# Used by:
#   run_discordant_reads.pl
MIN_DISCORDANT_READS=3

# Maximum distance for clustering nearby discordant read-pair signals.
#
# Used by:
#   run_discordant_reads.pl
DISCORDANT_CLUSTER_DISTANCE=500

# Whether to require deletion-like paired-end orientation.
#
# 1: keep deletion-like inward-facing FR orientation
# 0: do not filter by orientation
#
# Used by:
#   run_discordant_reads.pl
FILTER_DELETION_ORIENTATION=1


############################################################
# 11. Evidence merging
############################################################

# Minimum fraction of split DEL bases that must be covered by
# depth evidence or discordant evidence.
#
# Example:
#   0.90 means at least 90% of split DEL bases must be covered.
#
# Used by:
#   HCMExonDel.pl
#   merge_evidence.pl
EVIDENCE_OVERLAP_FRACTION=0.90


############################################################
# 12. Candidate BAM extraction
############################################################

# Flanking size added when extracting candidate gene BAM files.
#
# 0:
#   strict gene coordinates.
#
# 5000:
#   extract gene coordinates with +/- 5000 bp extension.
#
# Used by:
#   HCMExonDel.pl
#   extract_candidate_gene_bam.pl
CANDIDATE_BAM_FLANK=0


############################################################
# 13. Candidate exon annotation
############################################################

# Minimum fraction of an exon that must be overlapped by a candidate
# deletion interval to be considered affected.
#
# Definition:
#   exon_overlap_fraction = overlap_length / exon_length
#
# 0.20: sensitive exon-level annotation
# 0.50: stricter annotation
#
# Used by:
#   annotate_candidates.pl
MIN_EXON_OVERLAP_FRACTION=0.20


############################################################
# 14. Runtime settings
############################################################

# Whether to keep temporary files.
#
# 0: remove tmp directory after each sample
# 1: keep tmp directory
#
# Used by:
#   HCMExonDel.pl
KEEP_TMP=0

# Verbose logging.
#
# 0: quiet
# 1: verbose
#
# Used by scripts that support verbose mode.
VERBOSE=1

