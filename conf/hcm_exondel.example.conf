############################################################
# HCMExonDel example configuration file
#
# Format:
#   KEY=VALUE
#
# Notes:
#   1. Lines beginning with # are ignored.
#   2. BAM list is specified by hcm_exondel.pl --bam-list.
#   3. Output directory is specified by hcm_exondel.pl --outdir.
#   4. All interval files use tab-delimited TXT format.
#   5. Coordinates in TXT interval files are 1-based closed.
#   6. No BED files are required.
############################################################


############################################################
# 1. Software paths
############################################################

# Perl executable.
PERL=/usr/bin/perl

# Python executable.
PYTHON=/usr/bin/python3

# Samtools executable.
# Required by depth, split-read and discordant-read modules.
SAMTOOLS=/opt/PUB/software/Bin/samtools-1.16.1/bin/samtools

# Bedtools executable.
# Reserved for possible future interval operations.
BEDTOOLS=/path/to/bedtools


############################################################
# 2. Reference genome
############################################################

# Reference genome FASTA.
# Must match the genome build used for BAM alignment.
REF_FASTA=/path/to/hg19.fa

# FASTA index file generated by:
# samtools faidx hg19.fa
REF_FASTA_INDEX=/path/to/hg19.fa.fai


############################################################
# 3. MANE RefSeq coordinate TXT files
############################################################

# Exon coordinate TXT file.
#
# Required columns:
#   Gene    Transcript    Exon    Chrom    Start    End    Strand
#
# Coordinate:
#   1-based closed interval
#
# Example:
#   FHOD3    NM_001281740    12    chr18    34232240    34233000    -
REFSEQ_MANE_SELECT_EXON_TXT=db/exon_annotation_bed/RefSeq_MANE_Select.exon.txt

# Gene coordinate TXT file.
#
# Required columns:
#   Gene    Transcript    Chrom    Start    End    Strand    ExonCount
#
# Coordinate:
#   1-based closed interval
#
# Example:
#   FHOD3    NM_001281740    chr18    33877676    34360183    -    28
REFSEQ_MANE_SELECT_GENE_TXT=db/exon_annotation_bed/RefSeq_MANE_Select.gene.txt

# Flanking size added to gene regions when scanning split reads
# and discordant read pairs.
#
# Note:
#   The original gene coordinates remain 1-based.
#   Downstream scripts should internally apply this flank
#   when constructing samtools regions.
#
# Recommended:
#   0     strict gene region
#   5000  capture nearby breakpoint-supporting reads
TARGET_REGION_FLANK=5000


############################################################
# 4. BAM requirements and common read filters
############################################################

# BAM should be coordinate-sorted.
BAM_SORT=coordinate

# Whether BAM index is required.
# hcm_exondel.pl checks BAM index before generating shell.
REQUIRE_BAI=1

# Minimum mapping quality.
MIN_MAPQ=20

# Whether duplicate reads should be excluded.
#
# 1: exclude duplicate reads
# 0: keep duplicate reads
EXCLUDE_DUPLICATES=1


############################################################
# HCM core gene filtering
############################################################

# Core HCM gene list.
# One gene symbol per line.
#
# Example:
#   MYH7
#   MYBPC3
#   FHOD3
HCM_CORE_GENE_LIST=db/hcm_core_genes.txt

# Whether to analyze only genes listed in HCM_CORE_GENE_LIST.
#
# 1: only analyze HCM core genes
# 0: analyze all genes in REFSEQ_MANE_SELECT_GENE_TXT
#
# Recommended:
#   1
ANALYZE_CORE_GENES_ONLY=1



# ============================================================
# Window depth calculation
# ============================================================

WINDOW_SIZE=1000
WINDOW_STEP=500
MIN_WINDOW_SIZE=100

MIN_GENE_MEAN_DEPTH=20
MIN_DEPTH_MAPQ=20
EXCLUDE_DUPLICATES_FOR_DEPTH=1


# ============================================================
# Depth-ratio deletion calling
# ============================================================

DEL_DEPTH_RATIO_CUTOFF=0.65
MIN_CONSECUTIVE_DEL_WINDOWS=3


# ============================================================
# Intermediate files
# ============================================================

KEEP_GENE_DEPTH_FILE=1





############################################################
# 6. Target scanning parameters
############################################################

# These parameters define the genomic regions scanned by
# split-read and discordant read-pair modules.
#
# Depth analysis always uses gene regions from:
#   REFSEQ_MANE_SELECT_GENE_TXT
#
# When SCAN_WHOLE_BAM=0:
#   split-read and discordant read-pair modules scan only target
#   gene regions from REFSEQ_MANE_SELECT_GENE_TXT, with
#   TARGET_REGION_FLANK added to both sides.
#
# When SCAN_WHOLE_BAM=1:
#   split-read and discordant read-pair modules scan the whole BAM.
#
# Recommended:
#   0

# NOT USED. 2026/4/15
# SCAN_WHOLE_BAM=0



############################################################
# 7. Split-read parameters
############################################################

# Split-read evidence is used to support candidate deletion breakpoints.

# Minimum mapping quality for split-read evidence.
MIN_SPLIT_MAPQ=20

# Minimum soft-clipped length.
MIN_SOFTCLIP_LENGTH=10

# Minimum number of split reads required to support one candidate breakpoint.
MIN_SPLIT_READS=2

# Maximum distance for clustering nearby split-read signals.
SPLIT_CLUSTER_DISTANCE=10



# ============================================================
# SA split-read extraction and clustering parameters
# ============================================================

# Minimum MAPQ for primary alignment of SA split-read evidence.
SPLIT_READ_MIN_MAPQ=20

# Whether to exclude duplicate reads in SA split-read extraction.
# 1: exclude duplicate reads
# 0: keep duplicate reads
SPLIT_READ_EXCLUDE_DUP=1

# Maximum allowed breakpoint difference for clustering SA split-read
# deletion events. Both SV_Start and SV_End must be within this window.
# Unit: bp
SA_SPLIT_CLUSTER_WINDOW=20

# Minimum number of unique read names required for an SA split-read
# cluster to be marked as Pass.
SA_SPLIT_MIN_SUPPORT_READS=5



############################################################
# 8. Discordant read-pair parameters
############################################################

# Discordant read pairs are used to support deletion-like events.

# Minimum mapping quality for discordant read-pair evidence.
MIN_DISCORDANT_MAPQ=20

# Minimum inferred insert size for deletion-like read pairs.
MIN_DISCORDANT_INSERT_SIZE=1000

# Minimum number of discordant read pairs required to support one candidate.
MIN_DISCORDANT_READS=3

# Maximum distance for clustering nearby discordant read-pair signals.
DISCORDANT_CLUSTER_DISTANCE=500

# Whether to require deletion-like paired-end orientation.
#
# For typical WGS paired-end data, deletion-supporting discordant
# read pairs should have inward-facing FR orientation after sorting by
# genomic coordinate:
#
#   left read  = Forward
#   right read = Reverse
#
# This keeps both F1R2 and F2R1, and filters R1F2/R2F1.
#
# 1 = enable orientation filter
# 0 = disable orientation filter
FILTER_DELETION_ORIENTATION=1


############################################################
# 9. Evidence merging and final candidate filtering
############################################################

# Maximum distance for merging candidates from different evidence types.
#
# Evidence types:
#   depth
#   split_read
#   discordant_pair
EVIDENCE_MERGE_DISTANCE=1000

# Minimum number of evidence types required for final candidates.
#
# Recommended:
#   1: sensitive discovery
#   2: higher-confidence reporting
MIN_EVIDENCE_COUNT=2




############################################################
# 10. Candidate exon annotation parameters
############################################################

# Candidate exon annotation uses:
#   REFSEQ_MANE_SELECT_EXON_TXT
#
# Exon coordinates are 1-based closed intervals.
#
# Required columns:
#   Gene    Transcript    Exon    Chrom    Start    End    Strand
#
# A candidate deletion is annotated to an exon if the overlap
# between the candidate interval and the exon interval reaches
# the threshold below.

# Minimum fraction of an exon that must be overlapped by a candidate
# deletion interval to be considered affected.
#
# Definition:
#   exon_overlap_fraction = overlap_length / exon_length
#
# Example:
#   MIN_EXON_OVERLAP_FRACTION=0.20
# means at least 20% of an exon must overlap the candidate deletion.
#
# Recommended:
#   0.20 for sensitive exon-level annotation
#   0.50 for stricter annotation
MIN_EXON_OVERLAP_FRACTION=0.20

# Candidate evidence level to annotate.
#
# Common values:
# High
# Medium
# Low
# All
#
# High: annotate only candidates with Evidence_Level=High
# All : annotate all candidates regardless of Evidence_Level
#
# Recommended:
# High
ANNOTATE_EVIDENCE_LEVEL=High


############################################################
# 10. Runtime settings
############################################################

# Number of threads used by scripts that support multithreading.
THREADS=4

# Whether to keep temporary files.
#
# 0: remove tmp directory after each sample
# 1: keep tmp directory
KEEP_TMP=0

# Verbose logging.
#
# 0: quiet
# 1: verbose
VERBOSE=1

